[project]
name = "ai-editor"
version = "0.1.0"
description = "Player e editor de vídeo/áudio leve para Linux, controlado por IA via MCP"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
readme = "README.md"
authors = [
    { name = "Richardson", email = "richardsonlbessa@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=2.3.0",
    "numpy>=2.5.4",
    "pyside6>=6.12.0",
    "python-mpv>=1.0.8",
    "qtawesome>=1.4.2",
]

[project.scripts]
ai-editor = "ai_editor.cli:main"
ai-editor-mcp = "ai_editor.mcp_server:main"

[project.optional-dependencies]
ia = [
    "onnxruntime>=1.31.1",
]

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
]
