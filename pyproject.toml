[project]
name = "claude-player"
version = "0.1.0"
description = "Player de vídeo leve controlado pelo Claude via MCP"
authors = [
    { name = "Richardson", email = "richardsonlbessa@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "mcp[cli]>=2.3.0",
    "numpy>=2.5.4",
    "pyside6>=6.12.0",
    "python-mpv>=1.0.8",
    "qtawesome>=1.4.2",
]

[project.scripts]
claude-player = "claude_player.app:main"
claude-player-mcp = "claude_player.mcp_server:main"

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"
