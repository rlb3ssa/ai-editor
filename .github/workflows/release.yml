# Release: a cada tag vX.Y.Z, gera o AppImage (+ .zsync), o bundle .mcpb e publica na Release do GitHub.
# Dois jobs: o build roda só com leitura; a publicação (único job com contents: write) recebe dist/ como artefato.
# Actions fixadas por SHA (comentário = versão). Para atualizar: git ls-remote https://github.com/<ação> refs/tags/<versão>
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  appimage:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      UV_PYTHON: /usr/bin/python3.12
      AI_EDITOR_BUILD_DIR: ${{ github.workspace }}/../ai-editor-build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Dependências do sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3.12-dev libmpv2 libxcb-cursor0 mediainfo perl patchelf zsync desktop-file-utils file curl xz-utils git

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3

      - name: Confere a versão da tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          versao="$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml | head -1)"
          if [ "v$versao" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} não bate com a versão do pyproject.toml ($versao)"; exit 1
          fi

      - name: Build do AppImage
        run: packaging/build_appimage.sh

      - name: Testes do AppImage
        run: |
          app="$(ls dist/AI_Editor-*-x86_64.AppImage)"
          export APPIMAGE_EXTRACT_AND_RUN=1
          "$app" --versao
          find "$AI_EDITOR_BUILD_DIR/AppDir" -name 'libxcb-cursor.so.0*' | grep -q . || { echo "::error::libxcb-cursor fora do pacote"; exit 1; }
          test -s "$AI_EDITOR_BUILD_DIR/AppDir/usr/share/doc/ai-editor/ffmpeg/BIBLIOTECAS.tsv"
          test -f "$AI_EDITOR_BUILD_DIR/AppDir/usr/share/doc/ai-editor/python/pyside6-essentials/LGPL-3"
          "$app" --diagnostico | tee diag.txt
          for f in ffmpeg ffprobe libmpv mediainfo exiftool c2patool; do
            grep -E "✔ $f .*\[pacote\]" diag.txt >/dev/null || { echo "::error::$f não veio do pacote"; exit 1; }
          done
          printf '%s\n' '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
            | timeout 60 "$app" --mcp > init.json
          grep -q '"serverInfo"' init.json

      - name: Checksums
        run: |
          cd dist
          sha256sum AI_Editor-*.AppImage AI_Editor-*.AppImage.zsync ai-editor-*.mcpb COMPONENTES.txt LICENCAS_TERCEIROS.md > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Artefato dist/
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: ai-editor-dist
          path: |
            dist/AI_Editor-*-x86_64.AppImage
            dist/AI_Editor-*-x86_64.AppImage.zsync
            dist/ai-editor-*.mcpb
            dist/COMPONENTES.txt
            dist/LICENCAS_TERCEIROS.md
            dist/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  publicar:
    needs: appimage
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: ai-editor-dist
          path: dist

      - name: Confere os checksums
        run: cd dist && sha256sum -c SHA256SUMS.txt

      - name: Publica na Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3  # v3.0.4
        with:
          name: AI Editor ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/AI_Editor-*-x86_64.AppImage
            dist/AI_Editor-*-x86_64.AppImage.zsync
            dist/ai-editor-*.mcpb
            dist/COMPONENTES.txt
            dist/LICENCAS_TERCEIROS.md
            dist/SHA256SUMS.txt
